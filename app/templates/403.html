<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso negado — Manto</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-app.png">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      background: var(--bg, #f4f3f8);
    }
    .error-gif {
      width: 220px;
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 700;
      color: var(--accent, #544596);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .error-desc {
      color: var(--muted, #666);
      margin-bottom: 2rem;
      max-width: 380px;
      font-size: 14px;
    }
    .error-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn-wa {
      display: inline-flex; align-items: center; gap: 8px;
      background: #25D366; color: #fff; border: none;
      padding: 10px 20px; border-radius: 8px; font-size: 14px;
      font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .btn-wa:hover { background: #1ebe5d; }
  </style>
</head>
<body>
<div class="error-page">
  <img src="/static/giphy.gif" alt="" class="error-gif">
  <div class="error-code">403</div>
  <div class="error-title">Opa, parece que você não tem acesso a essa página</div>
  <p class="error-desc">Se você acha que isso é um engano, peça para o administrador ajustar a sua permissão.</p>
  <div class="error-actions">
    <a href="/" class="btn btn-primary">Ir para o início</a>
    <a href="javascript:history.back()" class="btn btn-secondary">Voltar</a>
    {% if wa_link %}
    <a href="{{ wa_link }}" target="_blank" rel="noopener" class="btn-wa">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Reportar pelo WhatsApp
    </a>
    {% endif %}
  </div>
</div>
</body>
</html>
