<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link inválido — Manto Produções</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-portal.png">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .fb-invalid { max-width: 420px; margin: 0 auto; padding: 80px 20px; text-align: center; }
    .fb-invalid .emoji { font-size: 44px; margin-bottom: 16px; }
    .fb-invalid h1 { font-size: 19px; margin-bottom: 10px; }
    .fb-invalid p { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="fb-invalid">
    <div class="emoji">🔗</div>
    <h1>Este link de avaliação não é válido</h1>
    <p>Confira se o link foi copiado corretamente, ou peça um novo link a quem enviou.</p>
  </div>
</body>
</html>
