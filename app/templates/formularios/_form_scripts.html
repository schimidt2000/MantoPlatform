{# JS compartilhado dos formulários públicos: máscaras leves, condicional "Outros",
   proteção de duplo envio e rolagem até o primeiro erro (feature 118). #}
<script>
  (function () {
    // ── Máscaras leves (formatam enquanto digita; validação real é no servidor) ──
    function maskDigits(el, fmt) {
      el.addEventListener('input', function () {
        var d = el.value.replace(/\D/g, '');
        el.value = fmt(d);
      });
    }
    var cpf = document.querySelectorAll('[data-mask="cpf"]');
    cpf.forEach(function (el) {
      maskDigits(el, function (d) {
        d = d.slice(0, 11);
        return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      });
    });
    document.querySelectorAll('[data-mask="cnpj"]').forEach(function (el) {
      maskDigits(el, function (d) {
        d = d.slice(0, 14);
        return d.replace(/(\d{2})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1/$2').replace(/(\d{4})(\d{1,2})$/, '$1-$2');
      });
    });
    document.querySelectorAll('[data-mask="cep"]').forEach(function (el) {
      maskDigits(el, function (d) {
        d = d.slice(0, 8);
        return d.replace(/(\d{5})(\d{1,3})$/, '$1-$2');
      });
    });
    document.querySelectorAll('[data-mask="phone"]').forEach(function (el) {
      maskDigits(el, function (d) {
        d = d.slice(0, 11);
        if (d.length > 10) return d.replace(/(\d{2})(\d{5})(\d{1,4})/, '($1) $2-$3');
        if (d.length > 6) return d.replace(/(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
        if (d.length > 2) return d.replace(/(\d{2})(\d+)/, '($1) $2');
        return d;
      });
    });

    // ── Condicional "Outros" na forma de pagamento ──────────────────────
    var pagamento = document.getElementById('f-forma_pagamento');
    var outrosWrap = document.getElementById('wrap-descreva_outros');
    function toggleOutros() {
      if (!pagamento || !outrosWrap) return;
      outrosWrap.style.display = pagamento.value === 'Outros' ? '' : 'none';
    }
    if (pagamento) { pagamento.addEventListener('change', toggleOutros); toggleOutros(); }

    // ── Proteção de duplo envio ─────────────────────────────────────────
    var form = document.getElementById('pre-form');
    var btn = document.getElementById('btn-submit');
    if (form && btn) {
      form.addEventListener('submit', function () {
        btn.disabled = true;
        btn.textContent = 'Enviando…';
      });
    }

    // ── Rolar até o primeiro campo com erro ─────────────────────────────
    var firstErr = document.querySelector('.field-invalid');
    if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
  })();
</script>
