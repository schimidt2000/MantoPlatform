<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro enviado — Manto Produções</title>
  <style>
    :root { --bg: #f4f3f8; --accent: #544596; --accent-dark: #3c316b; --muted: #6b6b6b; --line: #e5e3ef; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: #1d1b2b; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 40px 28px; max-width: 440px; text-align: center;
      box-shadow: 0 10px 40px rgba(60,49,107,.10);
    }
    .check {
      width: 72px; height: 72px; border-radius: 50%; background: var(--accent);
      color: #fff; font-size: 38px; line-height: 72px; margin: 0 auto 18px;
    }
    h1 { font-size: 22px; margin: 0 0 10px; color: var(--accent-dark); }
    p { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
    .btn {
      display: inline-block; margin-top: 20px; padding: 12px 22px; font-weight: 700;
      color: #fff; background: var(--accent); border-radius: 12px; text-decoration: none;
    }
    .btn:hover { background: var(--accent-dark); }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Cadastro enviado!</h1>
    <p>Recebemos seus dados e suas fotos com sucesso.</p>
    <p>Nossa equipe vai analisar o seu cadastro. Obrigado pelo interesse em fazer parte da Manto
       Produções! 💜</p>
    <a class="btn" href="{{ url_for('cadastro.form') }}">Fazer outro cadastro</a>
  </div>
</body>
</html>
