<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personagem não encontrado — Catálogo Manto</title>
  {% include "catalogo/_head_shared.html" %}
  <style>
    .cat-invalid { max-width: 420px; margin: 0 auto; padding: 100px 20px; text-align: center; }
    .cat-invalid .emoji { font-size: 44px; margin-bottom: 16px; }
    .cat-invalid h1 { font-size: 22px; margin-bottom: 10px; }
    .cat-invalid p { color: var(--cat-muted); font-size: 14.5px; margin-bottom: 26px; }
  </style>
</head>
<body>
  <div class="cat-invalid">
    <div class="emoji">🎭</div>
    <h1 class="cat-display">Não achamos esse personagem</h1>
    <p>O link pode estar incorreto, ou o item não está mais disponível no catálogo.</p>
    <a href="/catalogo/" class="cat-btn">Ver o catálogo completo</a>
  </div>
</body>
</html>
