<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de desejos — Catálogo Manto Produções</title>
  <meta name="robots" content="noindex, nofollow">
  {% include "catalogo/_head_shared.html" %}
  <style>
    .cat-topbar { padding: 20px 0; border-bottom: 1px solid var(--cat-line); }
    .cat-back { font-size: 13.5px; font-weight: 600; color: var(--cat-muted); text-decoration: none; }
    .cat-back:hover { color: var(--cat-accent); }

    .wish-header { padding: 40px 0 24px; text-align: center; }
    .wish-header h1 { font-size: clamp(28px, 5vw, 40px); margin: 8px 0 8px; text-wrap: balance; }
    .wish-header p { color: var(--cat-muted); font-size: 14.5px; }

    .wish-main { padding: 8px 0 90px; max-width: 640px; margin: 0 auto; }

    .wish-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--cat-panel); border-radius: var(--cat-radius); box-shadow: var(--cat-shadow);
      padding: 12px 16px; margin-bottom: 12px;
    }
    .wish-item-img {
      width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex-shrink: 0;
      background: var(--cat-bg-alt);
    }
    .wish-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .wish-item-name { flex: 1; font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; }
    .wish-item-remove {
      background: none; border: none; color: var(--cat-muted); cursor: pointer;
      font-size: 20px; line-height: 1; padding: 6px;
    }
    .wish-item-remove:hover { color: #c0392b; }

    .wish-empty { text-align: center; padding: 60px 20px; color: var(--cat-muted); }
    .wish-empty .emoji { font-size: 40px; margin-bottom: 12px; }

    .wish-actions { margin-top: 24px; text-align: center; }
    .wish-send-btn:disabled { opacity: .45; cursor: not-allowed; }
    .wish-send-btn:disabled:hover { transform: none; box-shadow: none; }
  </style>
</head>
<body data-wa-number="{{ whatsapp_number }}">

  <div class="cat-topbar">
    <div class="cat-shell">
      <a href="/catalogo/" class="cat-back">← Voltar ao catálogo</a>
    </div>
  </div>

  <header class="wish-header">
    <div class="cat-shell">
      <div class="cat-eyebrow">✦ Manto Produções</div>
      <h1 class="cat-display">Sua lista de desejos</h1>
      <p>Reveja os personagens escolhidos e envie a lista pra gente pelo WhatsApp.</p>
    </div>
  </header>

  <main class="wish-main">
    <div class="cat-shell" style="padding:0;">
      <div id="wishList"></div>
      <div class="wish-empty" id="wishEmpty" style="display:none;">
        <div class="emoji">🤍</div>
        <div>Sua lista está vazia. Volte ao catálogo e adicione os personagens que você gostou.</div>
      </div>
      <div class="wish-actions">
        <button type="button" class="cat-btn wish-send-btn" id="wishSendBtn" disabled>
          📲 Enviar para o vendedor
        </button>
      </div>
    </div>
  </main>

<script src="/static/js/catalogo-wishlist.js"></script>
<script>
  (function () {
    var listEl = document.getElementById('wishList');
    var emptyEl = document.getElementById('wishEmpty');
    var sendBtn = document.getElementById('wishSendBtn');
    var waNumber = document.body.getAttribute('data-wa-number');

    function render() {
      var items = window.MantoWishlist.getAll();
      listEl.innerHTML = '';
      items.forEach(function (item) {
        var row = document.createElement('div');
        row.className = 'wish-item';

        var imgWrap = document.createElement('div');
        imgWrap.className = 'wish-item-img';
        if (item.cover) {
          var img = document.createElement('img');
          img.src = item.cover;
          img.alt = item.name;
          imgWrap.appendChild(img);
        }
        row.appendChild(imgWrap);

        var nameEl = document.createElement('a');
        nameEl.className = 'wish-item-name';
        nameEl.href = '/catalogo/' + item.slug;
        nameEl.textContent = item.name;
        nameEl.style.textDecoration = 'none';
        nameEl.style.color = 'inherit';
        row.appendChild(nameEl);

        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'wish-item-remove';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remover da lista';
        removeBtn.addEventListener('click', function () {
          window.MantoWishlist.remove(item.slug);
          render();
        });
        row.appendChild(removeBtn);

        listEl.appendChild(row);
      });

      emptyEl.style.display = items.length === 0 ? 'block' : 'none';
      listEl.style.display = items.length === 0 ? 'none' : 'block';
      sendBtn.disabled = items.length === 0;
    }

    sendBtn.addEventListener('click', function () {
      var url = window.MantoWishlist.whatsappUrl(waNumber, window.location.origin);
      if (url) window.open(url, '_blank', 'noopener');
    });

    render();
  })();
</script>
</body>
</html>
