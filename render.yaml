# Blueprint de PRODUÇÃO da Manto no Render — FONTE ÚNICA do deploy desde 28/08/2026.
# Push na `main` é deploy (autoDeploy, ~60s), só dos serviços cujos arquivos mudaram (rootDir e
# buildFilter abaixo — feature 340). Não há staging.
# Contrato de deploy e operação: docs/01_SISTEMA_E_BANCO.md §5. Como publicar: DEVELOPMENT.md.
# História da migração (Railway banido em 28/08/2026): docs/03, entrada 264; registro do incidente
# em docs/CONTINGENCIA_RENDER.md. Os envVars com sync:false ficam vazios de propósito (segredos
# preenchidos no painel, a partir do .env local do dono — nunca em chat/commit).

databases:
  - name: manto-postgres
    plan: basic-1gb
    region: oregon
    databaseName: manto
    user: manto

services:
  - type: web
    name: manto-backend
    runtime: python
    plan: standard            # backend usa ~1GB de RAM (3 workers) — starter (512MB) nao serve
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt
    # MEXER NESTA LINHA DERRUBA A PRODUÇÃO QUANDO DÁ ERRADO (26/08/2026: a flag
    # `--access-log-format` não existe — o certo é `--access-logformat` — e o gunicorn nunca subiu).
    # Rode `python scripts/validar_startcommand.py` ANTES do push e faça a mudança em commit
    # sozinho, fora do horário, com os Events do Render abertos: o serviço tem disco, o container
    # antigo cai antes de o novo responder, e start que falha deixa a produção fora.
    # --threads 12 (não 4): streaming de mídia é I/O-bound e cada download segura uma thread do
    # primeiro ao último byte; com 4 threads, dois ou três vídeos travavam um worker inteiro.
    # Subir threads exige subir o pool do SQLAlchemy junto (app/config.py) — o validador confere.
    startCommand: flask db upgrade && python seed.py && gunicorn run:app --workers 3 --worker-class gthread --threads 12 --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 120 --max-requests 800 --max-requests-jitter 100 --access-logfile - --access-logformat '%(h)s %(m)s %(U)s %(s)s %(b)s %(D)s'
    healthCheckPath: /health
    autoDeploy: true
    # Feature 340: push que não mexe no backend não o reinicia. Este serviço tem disco, e todo
    # deploy dele é ~1 min de queda; antes, até o commit de "novidades" derrubava a equipe. Os
    # caminhos são da raiz do repositório. Mudança no próprio render.yaml é processada sempre. O
    # Flask não lê nada destas pastas em tempo de execução (conferido na 340) — se um dia ler,
    # tire a pasta daqui.
    buildFilter:
      ignoredPaths:
        - docs/**
        - specs/**
        - frontend/**
        - servicos/**
        - .claude/**
        - .specify/**
    disk:
      name: manto-instance
      mountPath: /opt/render/project/src/instance   # uploads/, nfc_media/, virtual_videos/, .secret_key
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manto-postgres
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        value: joao@mantoproducoes.com.br
      - key: MAIL_SENDER_NAME
        value: Sistema Manto
      - key: CORS_ALLOWED_ORIGINS
        value: https://beta.mantoproducoes.com.br,https://app.mantoproducoes.com.br
      - key: SECRET_KEY
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS
        sync: false
      - key: FIGURINO_DRIVE_FOLDER_ID
        sync: false
      - key: TALENTS_SPREADSHEET_ID
        sync: false
      - key: TALENTS_SHEET_NAME
        sync: false
      # PORTAL_URL foi REMOVIDA de propósito (hotfix 269b): o default do código é o portal real
      # (`PORTAL_BASE_URL`, app/config.py) e é ele que o artista recebe por e-mail. A variável
      # existia aqui como `sync: false`, foi preenchida no painel com `http://localhost:5000` e
      # ninguém viu — todo convite e link de redefinição de senha saiu apontando para lá. Um
      # endereço local agora é ignorado por qualquer processo que envie e-mail de verdade, mas o
      # jeito de não errar é não ter a variável.
      - key: AUDIT_AGENT_TOKEN
        sync: false
      - key: MARKETING_AGENT_TOKEN
        sync: false
      # Feature 317: token da API v3 da ClickSign (conta PRIME DREAMS, token "Plataforma Manto").
      # Vazio = integração desligada (a subida avisa no log). Nunca no banco.
      - key: CLICKSIGN_ACCESS_TOKEN
        sync: false
      # Feature 310: opcional. Com a chave, o link nasce com validade e pagamento único e a
      # reconsulta fica autenticada; sem ela a loja funciona do mesmo jeito. O dono cola no painel.
      - key: INFINITEPAY_API_KEY
        sync: false
      # Feature 310: o MESMO valor no manto-frontend. Prova que a requisição veio do Node — sem
      # ele, o IP do cliente informado pelo Node é aceito sem prova (o boot avisa no log).
      - key: MANTO_PROXY_SECRET
        sync: false

  # Healthcheck desde a feature 340 (era a dívida 22 do docs/05): sem ele o Render derrubava o
  # container velho antes do novo responder e cada push de tela abria ~1 min de 502 na porta
  # pública. Com ele, e sem disco, o Render só troca depois de o novo responder. `/` não passa pelo
  # Flask: com host desconhecido (o do healthcheck) o server.js serve o index do app interno — prova
  # que o Node subiu e o bundle existe, sem depender do backend. O `rootDir` já faz o deploy daqui
  # acontecer só quando `frontend/` muda.
  - type: web
    name: manto-frontend
    runtime: node
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BACKEND_URL
        sync: false           # preencher com a URL publica do manto-backend depois que ele existir
      - key: MANTO_PROXY_SECRET
        sync: false           # o mesmo valor do manto-backend (feature 310)

  # Caixa de avisos de pagamento (feature 340). Recebe o aviso da InfinitePay e SÓ guarda em
  # `virtual_payment_inbox`; o manto-backend drena e decide. Existe porque o backend tem disco e o
  # Render não troca serviço com disco sem queda: num push, o aviso que pegava o 502 se perdia (a
  # operadora só reenvia com 400). Este serviço não tem disco e tem healthcheck — o Render só troca
  # o container depois de o novo responder — e o `rootDir` faz o deploy acontecer só quando
  # `servicos/avisos/` muda. `starter` porque o `free` dorme após 15 min e levaria o aviso junto.
  # Log de acesso SEM `%(U)s`/`%(r)s`: o segredo do aviso mora no caminho da URL.
  - type: web
    name: manto-avisos
    runtime: python
    plan: starter
    region: oregon
    rootDir: servicos/avisos
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:aplicacao --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 30 --graceful-timeout 30 --access-logfile - --access-logformat '%(h)s %(m)s %(s)s %(b)s %(D)s'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manto-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
