[phases.build]
# sync_worker.py não deve rodar durante o build da imagem Docker
cmds = []

[start]
# MANTENHA IDENTICO ao startCommand de railway.json (que tem precedencia) e rode
# `scripts/db/validar_startcommand.py` ANTES de qualquer push que mexa nesta linha:
# em 26/08/2026 a flag `--access-log-format` (que NAO existe — o certo e `--access-logformat`)
# fez o gunicorn recusar os argumentos, nunca subir, e derrubou a producao.
# --threads 12: streaming de midia e I/O-bound e cada download segura uma thread do primeiro ao
# ultimo byte; com 4 threads, dois ou tres videos travavam um worker inteiro.
cmd = "flask db upgrade && python seed.py && gunicorn run:app --workers 3 --worker-class gthread --threads 12 --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 120 --max-requests 800 --max-requests-jitter 100 --access-logfile - --access-logformat '%(h)s %(m)s %(U)s %(s)s %(b)s %(D)s'"
