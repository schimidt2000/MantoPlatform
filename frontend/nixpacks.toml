# Serviço estático dos DOIS SPAs (interno + público) no Railway (feature 186, US6).
# Requer "Root Directory = frontend" nas settings do serviço.
#
# IMPORTANTE: se houver um "Build Command"/"Start Command" custom nas settings do serviço
# no painel do Railway, ELE TEM PRECEDÊNCIA sobre este arquivo. Limpe os dois campos no
# painel para que estes comandos valham (foi um build command custom com `--filter=internal`
# — sintaxe de Turborepo/pnpm, não de npm — que causou o erro "Missing script: build").

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# npm ci exige lockfile em sincronia com todos os package.json do workspace.
cmds = ["npm ci"]

[phases.build]
# Compila apps/internal E apps/public (feature 186 — antes só compilava o interno; o público
# nunca teve deploy próprio). Os pacotes compartilhados (ui/api-client/money) NÃO têm build
# próprio: são consumidos direto do TypeScript-fonte via alias do Vite + paths do tsconfig,
# então o Vite os compila junto com cada app. Não há ordem de build a orquestrar entre os dois.
cmds = ["npm run build"]

[start]
# `server.js` substitui o antigo `serve --single` (que só sabia servir UM SPA): agora
# apps/internal/dist é servido na raiz e apps/public/dist sob `/catalogo/*`, cada um com seu
# próprio fallback de SPA (deep link/refresh funciona nos dois — ver `frontend/server.js`).
cmd = "npm run start"
